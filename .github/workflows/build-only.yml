name: Build only

# Собирает бинарь и ничего больше.
#
# Основной ci.yml на форке не запускается: в нём есть job релиза и публикации
# в docker, которым нужны права апстрима. Здесь только сборка, и только под ту
# платформу, которая нужна - собирать два десятка целей ради одной значит
# ждать полчаса вместо пяти минут.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: rust-proxy/workflows/.github/workflows/rust-build.yml@v2.0.0
    with:
      rust-toolchain: "stable"
      packages: "clash-rs"
      target-config-file: ".github/target-mips.toml"
      rustflags: ""
      enable-tmate: false
      enable-sccache: true
      only-clippy-tests-on-pr: true
