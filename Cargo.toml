[workspace]
resolver = "3"

members = [
    "clash-bin",
    "clash-lib",
    "clash-doc",
    "clash-ffi",
    "clash-dns",
    "clash-netstack"
]


[workspace.package]
version = "0.10.8"
repository = "https://github.com/Watfaq/clash-rs.git"
edition = "2024"
authors = ["https://github.com/Watfaq/clash-rs/graphs/contributors"]
homepage = "https://github.com/watfaq/clash-rs"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = "symbols"
debug = 0
panic = "abort"

[profile.detailed-release]
inherits = "release"
opt-level = 1
lto = "thin"
strip = "none"
debug = "line-tables-only"
split-debuginfo = "off"
panic = "unwind"
incremental = true
codegen-units = 256

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docker_test)', 'cfg(throughput_test)', 'cfg(tokio_unstable)'] }

[workspace.lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"

[patch.crates-io]
# Our fork of Watfaq/rustls, branched from watfaq/0.23.40. It adds the
# ClientHello shaping this fork is built on - GREASE, verbatim extensions, a
# dictated cipher list - none of which upstream rustls has an interest in.
# Track watfaq/0.23.40 there when it moves.
rustls = { git = "https://github.com/Rushan4eg/rustls.git", branch = "watfaq/utls" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", branch = "watfaq/0.26.4" }
shadowquic-macros = { git = "https://github.com/spongebob888/shadowquic.git", rev = "295034e1b6478706a4348565bfc3ecea8378da98" }

